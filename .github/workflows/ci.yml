name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/final-hardening]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Raven.sln
      - run: dotnet build backend/Raven.sln -c Release --no-restore
      - run: dotnet test backend/Raven.sln -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t raven-api-ci backend
      - run: docker build -t raven-frontend-ci frontend
      - run: python3 backend/deploy/container_smoke.py
