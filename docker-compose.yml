services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: raven-crawl4ai
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      # Current Crawl4AI images bind their API to the container loopback interface
      # unless a token is configured. The default is deliberately development-only.
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-raven-local-development-only}"
    shm_size: 1gb
    restart: unless-stopped
